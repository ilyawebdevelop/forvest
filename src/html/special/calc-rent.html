<section class="calc-rent sect">
  <div class="container">
    <img class="calc-rent-logo" src="@img/admin/util/logo.svg" alt="logo">
    <div class="grid-12 gap-6">
      <div class="col-lg-6">

        <div class="sectHead">
          <h2 class="h2">
            Рассчитаем стоимость аренды
          </h2>
        </div>

        <div class="grid-12 gap-40 mb-10">
          <div class="d-flex gap-30 flex-column col-lg-6">
            <div class="text--gray">
              Оставьте заявку, и мы подготовим для вас точный расчёт с учётом всех параметров. Или напишите нам в
              мессенджерах
            </div>
          </div>
          <div class="d-flex flex-column col-lg-6">
            <div class="d-flex align-start gap-15 mb-1">
              <img style="width: 19px;" src="@img/icons/check.svg" alt="icon">
              <span>Ответ в течение 15 минут</span>
            </div>
            <div class="d-flex align-start gap-15 mb-1">
              <img style="width: 19px;" src="@img/icons/check.svg" alt="icon">
              <span>Без обязательств</span>
            </div>
            <div class="d-flex align-start gap-15 mb-1">
              <img style="width: 19px;" src="@img/icons/check.svg" alt="icon">
              <span>Удобный способ связи</span>
            </div>
          </div>
        </div>

        <div class="productAction">
          <div class="socials">
            <a href="#" class="button productActionBtn" target="_blank" rel="nofollow">
              <img src="@img/admin/socials/max-2.svg" alt="social">
              <span>Написать в Max</span>
            </a>
            <ul>
              <li>
                <a href="#" target="_blank" rel="nofollow">
                  <img src="@img/admin/socials/tg-2.svg" alt="telegram">
                </a>
              </li>
              <li>
                <a href="#" target="_blank" rel="nofollow">
                  <img src="@img/admin/socials/wh-2.svg" alt="whatsapp">
                </a>
              </li>
            </ul>
          </div>
        </div>


      </div>
      <div class="col-lg-6">
        <div class="calc-rent-form">

          <div class="grid-12 gap-1 mb-10">
            <div class="inputW col-lg-6">
              <input type="text" class="calendar formInput" placeholder="Выберите дату">
            </div>
            <div class="inputW col-lg-6">
              <input type="text" class="formInput" placeholder="Продолжительность, ч">
            </div>
            <div class="inputW col-lg-6">
              <input type="text" class="formInput" placeholder="Адрес объекта">
            </div>
            <div class="inputW col-lg-6">
              <input type="text" class="formInput" placeholder="Что нужно перевозить?">
            </div>
            <div class="inputW col-lg-6">
              <input type="tel" class="formInput" placeholder="+7 (___) ___-__-__">
            </div>
            <button class="button button--orange h-50 col-lg-6 w-100">
              Получить расчёт
              <svg>
                <use xlink:href="img/icons/icons.svg#arrow-btn"></use>
              </svg>
            </button>
          </div>
          <div class="agreement text--gray">
            <input id="popFormAgree" type="checkbox" hidden>
            <label for="popFormAgree">
              <div class="rect"></div>
              <div class="agreementText">
                Я соглашаюсь с <a href="#">Правилами обработки персональных данных</a> и <a href="#">Политикой
                  конфиденциальности</a>
              </div>
            </label>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
